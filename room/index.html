<style>
/* Layout: one full-bleed room, nothing on top of it but two small pixel buttons in the bottom-left corner. One committed night-room look. */
:root{
  --night:#0e0c13;
  --panel:#16131d;
  --line:#3b3250;
  --cream:#f1e6cc;
  --dim:#a197b3;
  --mustard:#e9b04b;
  --f-display:"Pixelify Sans","Silkscreen",ui-monospace,monospace;
  --f-label:"Silkscreen",ui-monospace,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--f-label);overflow:hidden;-webkit-font-smoothing:none;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px dashed var(--mustard);outline-offset:3px}

#stage{position:fixed;inset:0;overflow:hidden;background:var(--night)}
#view,#marks{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#view{touch-action:none}
#marks{pointer-events:none}
#hot{position:absolute;inset:0;pointer-events:none}
#hot a{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;-webkit-user-drag:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#hot a:focus-visible{outline:2px dashed var(--mustard);outline-offset:2px}

/* corner controls */
#corner{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:10}
.pxbtn{width:36px;height:36px;display:grid;place-items:center;background:var(--panel);color:var(--cream);
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line),5px 5px 0 0 rgba(0,0,0,.45);transition:transform .06s steps(2)}
.pxbtn:hover,#info[aria-pressed="true"]{color:var(--mustard);box-shadow:0 -3px 0 0 var(--mustard),0 3px 0 0 var(--mustard),-3px 0 0 0 var(--mustard),3px 0 0 0 var(--mustard),5px 5px 0 0 rgba(0,0,0,.45)}
.pxbtn:active{transform:translate(2px,2px)}
.pxbtn svg{display:block;shape-rendering:crispEdges}
#info .glyph{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;transform:translateY(-1px)}
#sound .x{display:none}
#sound.off .waves{display:none}
#sound.off .x{display:inline}

/* keyboard list: invisible until it has focus */
#keynav{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 52px);display:flex;flex-direction:column;align-items:flex-start;gap:4px;z-index:11}
#keynav button{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#keynav button:focus{position:static;width:auto;height:auto;clip:auto;overflow:visible;padding:6px 9px 5px;background:var(--panel);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;box-shadow:0 0 0 2px var(--mustard)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#loader{position:fixed;inset:0;z-index:60;background:var(--night);display:grid;place-items:center;transition:opacity .5s steps(5)}
#loader.done{opacity:0;pointer-events:none}
#loader .l1{font-size:11px;letter-spacing:3px;color:var(--mustard);text-align:center}
#loader .meter{width:160px;height:8px;margin:12px auto 0;background:var(--panel);box-shadow:0 0 0 2px var(--line);position:relative}
#loader .meter i{position:absolute;inset:0 auto 0 0;width:0;background:var(--mustard);transition:width .2s steps(4)}
#fallback{position:fixed;inset:0;display:grid;place-items:center;z-index:70;padding:24px}
#fallback .box{max-width:420px;padding:18px 20px;background:var(--panel);font-size:12px;line-height:1.6}
#fallback h2{font-family:var(--f-display);margin:0 0 8px;font-size:24px}
#fallback a{color:var(--mustard)}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }

(function(){

function pg(ch){ return PGLYPH[ch] || PGLYPH[P_ALIAS[ch]] || PGLYPH[ch.toUpperCase()] || PGLYPH['?']; }

const PAL = {
  wall:'#7f927b', wallDeep:'#5f725f', ceiling:'#d8cfbd', trim:'#e9e1cf',
  oak:'#b47b48', oakLight:'#cf9f68', walnut:'#6a4128', walnutDark:'#4a2b19',
  rugIndigo:'#2d3264', rugDeep:'#1b1e3f', rugCream:'#e7d9b9', rugMustard:'#d9a53c', rugRust:'#b4553b',
  curtain:'#c99437', brass:'#c09443', shade:'#efe2c4',
  tv:'#0f0f13', leaf:'#4e7a46', leafDark:'#2f5232',
};

function px(ctx, x, y, c){ ctx.fillStyle=c; ctx.fillRect(x,y,1,1); }

/* Floor: narrow oak strips running toward the vanishing point (along v). 256px = 2m. */
const texFloor = canvasTex(256, 256, (ctx,w,h)=>{
  const R = mulberry(7), pw = 16;
  for (let i=0;i<w/pw;i++){
    let y = Math.floor(R()*200) - 200;
    while (y < h){
      const len = 70 + Math.floor(R()*130);
      const base = mix(PAL.oak, R()<.5? '#8f5a33':'#c48d58', R()*.55);
      for (const yy of [y, y+h, y-h]){
        ctx.fillStyle = base; ctx.fillRect(i*pw, yy, pw, len);
        // grain streaks
        for (let s=0;s<7;s++){
          const gx = i*pw + 1 + Math.floor(R()*(pw-2));
          const gy = yy + Math.floor(R()*len), gl = 6 + Math.floor(R()*30);
          ctx.fillStyle = R()<.6 ? shade(base,.86) : shade(base,1.08);
          ctx.fillRect(gx, gy, 1, Math.min(gl, yy+len-gy));
        }
        // butt joint
        ctx.fillStyle = shade(base,.55); ctx.fillRect(i*pw, yy+len-1, pw, 1);
        ctx.fillStyle = shade(base,1.12); ctx.fillRect(i*pw, yy, pw, 1);
      }
      y += len;
    }
    ctx.fillStyle = 'rgba(40,20,10,.75)'; ctx.fillRect(i*pw, 0, 1, h);
    ctx.fillStyle = 'rgba(255,230,190,.10)'; ctx.fillRect(i*pw+1, 0, 1, h);
  }
}, { mip:true, repeat:[3.5,4.5] });

/* Plaster: grey noise that tints with the material colour. */
const texPlaster = canvasTex(64, 64, (ctx,w,h)=>{
  const R = mulberry(11);
  ctx.fillStyle = '#e4e4e4'; ctx.fillRect(0,0,w,h);
  for (let i=0;i<520;i++){ const v = 214 + Math.floor(R()*40); ctx.fillStyle = `rgb(${v},${v},${v})`; ctx.fillRect(Math.floor(R()*w), Math.floor(R()*h), 1+Math.floor(R()*2), 1); }
}, { mip:true, repeat:[6,3] });

/* Wood grain for furniture (horizontal grain). */
function woodTex(base, seed, w=128, h=64, knots=2){
  return canvasTex(w, h, (ctx)=>{
    const R = mulberry(seed);
    ctx.fillStyle = base; ctx.fillRect(0,0,w,h);
    for (let y=0;y<h;y++){
      const k = .9 + .14*Math.sin(y*.55 + Math.sin(y*.13)*3);
      ctx.fillStyle = shade(base, k); ctx.fillRect(0,y,w,1);
    }
    for (let i=0;i<160;i++){
      const y = Math.floor(R()*h), x = Math.floor(R()*w), l = 8+Math.floor(R()*40);
      ctx.fillStyle = shade(base, R()<.55? .8 : 1.1); ctx.fillRect(x, y, l, 1);
    }
    for (let k=0;k<knots;k++){
      const cx = 10+R()*(w-20), cy = 6+R()*(h-12);
      for (let r=4;r>0;r--){ ctx.fillStyle = shade(base, .6+r*.08); ctx.fillRect(Math.round(cx-r*1.6), Math.round(cy-r*.6), Math.round(r*3.2), Math.max(1,Math.round(r*1.2))); }
    }
  }, { mip:true });
}
const texWalnut = woodTex(PAL.walnut, 21);
const texOak = woodTex(PAL.oakLight, 33, 192, 96, 1);

/* Slatted console doors */
const texSlats = canvasTex(96, 24, (ctx,w,h)=>{
  const R = mulberry(5);
  for (let x=0;x<w;x+=3){
    const c = shade(PAL.walnut, .9 + R()*.2);
    ctx.fillStyle = c; ctx.fillRect(x,0,2,h);
    ctx.fillStyle = shade(PAL.walnut,.42); ctx.fillRect(x+2,0,1,h);
    ctx.fillStyle = shade(c,1.18); ctx.fillRect(x,0,1,h);
  }
}, {});

/* Rug: kilim-ish geometry, cream fringe at the short ends (alpha). 3.2m x 2.2m */
const texRug = canvasTex(200, 136, (ctx,w,h)=>{
  const R = mulberry(3);
  const C = { i:PAL.rugIndigo, d:PAL.rugDeep, c:PAL.rugCream, m:PAL.rugMustard, r:PAL.rugRust };
  const F = 6; // fringe width in px
  ctx.clearRect(0,0,w,h);

  rect(x0+16,16,x1-x0-32,h-32,C.m);
  rect(x0+18,18,x1-x0-36,h-36,C.i);
  // field: diamond lattice
  const fx0=x0+18, fy0=18, fw=x1-x0-36, fh=h-36;
  for (let y=0;y<fh;y++) for (let x=0;x<fw;x++){

    if (d===9 || d===10) px(ctx,fx0+x,fy0+y,C.d);

/* dominant + accent colour of a cover (for spines, labels and back covers) */
function coverColors(id){
  const c = COVERS[id], pal = COVER_PAL[id]; const n = new Array(16).fill(0);
  for (const ch of c.d) n[parseInt(ch,16)]++;
  const order = n.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  const dom = pal[order[0]];
  let acc = pal[order[1]];
  for (const i of order.slice(1,8)){ const [r,g,b] = hexRGB(pal[i]); const sat = Math.max(r,g,b)-Math.min(r,g,b); if (sat > 70){ acc = pal[i]; break; } }
  return { dom, acc };
}

/* ---------------- bookshelf (back-left corner) ---------------- */
(function buildBookshelf(){
  const g = new THREE.Group(); g.position.set(-2.28, 0, ROOM.back+.16); scene.add(g);
  const W = .86, H = 1.86, D = .3, t = .026;
  const wood = toon({ map:texWalnut }), woodS = toon({ color:shade(PAL.walnut,.95) }), backM = toon({ color:shade(PAL.walnut,.62) });
  mesh(Box(t,H,D), [woodS,woodS,wood,wood,woodS,woodS], { x:-W/2+t/2, y:H/2 }, g);
  mesh(Box(t,H,D), [woodS,woodS,wood,wood,woodS,woodS], { x: W/2-t/2, y:H/2 }, g);
  mesh(Box(W,t,D), wood, { y:H-t/2 }, g);
  mesh(Box(W-2*t,.07,D-.02), backM, { y:.035, z:.01 }, g);
  mesh(Box(W-2*t,H,.01), backM, { y:H/2, z:-D/2+.005 }, g);
  const levels = [.07, .43, .79, 1.15, 1.5];
  const cols = ['#c9533d','#e2c07a','#2f5d7a','#3e3b5a','#7a9a6a','#efe3c6','#b4553b','#1f2a44','#d9a53c','#5b4a6e','#8c3b4a','#e9e1cf','#4a7d8c'];
  const mats = cols.map(c=>toon({ color:c, map:texSpine }));
  const R = mulberry(23);
  levels.forEach((y0,li)=>{
    if (li > 0) mesh(Box(W-2*t, t, D-.012), wood, { y:y0-t/2, z:.004 }, g);
    const gap = (li < levels.length-1 ? levels[li+1] : H) - y0 - t;
    let x = -W/2 + t + .006;
    const end = W/2 - t - .006;
    const leanAt = 3 + Math.floor(R()*6), stopAt = .55 + R()*.4;
    let i = 0;
    while (x < end - .03){
      if (li === 2 && i === 5){                                     // a small trailing plant
        const pot = mesh(lathe([[0,0],[.045,0],[.05,.07],[0,.07]], 12), toon({ color:'#c9b8a0' }), { x:x+.05, y:y0 }, g);
        for (let k=0;k<7;k++){ const a = k/7*Math.PI*2; const l = .08+R()*.14;
          rod(V3(x+.05, y0+.07, 0), V3(x+.05+Math.cos(a)*.06, y0+.07-l*.6 + (k%2)*.05, Math.sin(a)*.05+.03), .006, .004, toon({ color:k%2?'#4e7a46':'#6f9a5c' }), g, 4); }
        x += .11; i++; continue;
      }
      if (li === 4 && i === 0){                                     // stack lying flat
        let yy = y0;
        for (let k=0;k<4;k++){ const hh = .03+R()*.02; mesh(Box(.2-k*.012, hh, .2), mats[Math.floor(R()*mats.length)], { x:x+.11, y:yy+hh/2, ry:(R()-.5)*.15 }, g); yy += hh; }
        x += .24; i++; continue;
      }
      const bw = .018 + R()*.026, bh = Math.min(gap-.03, .2 + R()*.12), bd = .19 + R()*.06;
      const lean = (i === leanAt && x > -W/2 + .2) ? .28 : 0;
      mesh(Box(bw, bh, bd), mats[Math.floor(R()*mats.length)], { x:x+bw/2 + (lean? bh*Math.sin(lean)*.5:0), y:y0+bh/2*Math.cos(lean), z:(D-bd)/2 - .03, rz:-lean }, g);
      x += bw + .002 + (lean ? bh*Math.sin(lean) : 0);
      i++;
      if (lean || (x - (-W/2)) / W > stopAt + (li===0 ? .4 : 0)) break;
    }
  });
})();

  const servoM = toon({ map:texServo }), blue = toon({ color:'#2f62d0' }), pcb = toon({ map:texPCB });

    const s = new THREE.Group(); s.position.set(x*k, y*k, z*k); parent.add(s);

    if (horn === 'x'){ hr.rotation.z = Math.PI/2; hr.position.x = hs*(w/2+.002)*k; }
    else if (horn === 'z'){ hr.rotation.x = Math.PI/2; hr.position.z = hs*(d/2+.002)*k; }
    else { hr.position.y = hs*(h/2+.002)*k; }
    mesh(Cyl(.002*k,.002*k,.0045*k,6), black, {}, hr);

  };
  const uBracket = (parent, len, w, d, x, y, z)=>{

  servo(torso, .03, .04, .04, 0, .02, 0, 'y', -1);           // waist
  servo(torso, .094, .044, .058, 0, .062, 0, 'z', 1);         // chest block

    const up = uBracket(sh, .045, .026, .02, side*.01, -.01, 0);
    servo(up, .022, .04, .036, 0, -.048, 0, 'x', -side);
    const el = new THREE.Group(); el.position.y = -.07*k; up.add(el);

const STARS = (()=>{ const R = mulberry(99); return Array.from({length:70}, ()=>({ x:Math.floor(R()*160), y:Math.floor(R()*60), p:R()*6.28, b:R() })); })();
const CLOUDS = (()=>{ const R = mulberry(55); return Array.from({length:6}, ()=>({ x:R()*200-20, y:10+R()*34, w:14+Math.floor(R()*22), s:.6+R()*1.1 })); })();
const BAYER4 = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];

function drawSky(T, h, t){
  const ctx = skyTex.userData.ctx, W = 160, H = 100;
  // dithered vertical gradient
  const A = hexRGB(T.top), B = hexRGB(T.hor);
  const img = ctx.createImageData(W, H), d = img.data;
  for (let y=0;y<H;y++){
    const g = Math.pow(y/(H-1), 1.35) * 7;    // 8 colour steps
    for (let x=0;x<W;x++){
      const th = BAYER4[(y&3)*4 + (x&3)]/16;
      const step = Math.min(7, Math.floor(g + th)) / 7;
      const i = (y*W+x)*4;
      d[i] = lerp(A[0],B[0],step); d[i+1] = lerp(A[1],B[1],step); d[i+2] = lerp(A[2],B[2],step); d[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  // stars
  if (T.stars > .02){
    for (const s of STARS){
      const tw = .5 + .5*Math.sin(t*1.7 + s.p);
      if (s.b*T.stars*(.6+.4*tw) > .35){ ctx.fillStyle = s.b>.85 ? '#fff6d8' : '#c9d3ff'; ctx.fillRect(s.x, s.y, 1, 1); if (s.b>.94 && tw>.8){ ctx.fillRect(s.x-1,s.y,3,1); ctx.fillRect(s.x,s.y-1,1,3); } }
    }
  }
  // sun / moon: x across the window as the day goes
  const dayT = clamp((h-5.5)/13.5, 0, 1);
  if (T.sun > .05){
    const sx = Math.round(lerp(120, 30, dayT)), sy = Math.round(78 - Math.sin(dayT*Math.PI)*62);
    const sc = mix('#fff2c0', '#ff9a55', clamp(1 - Math.sin(dayT*Math.PI)*1.6, 0, 1));
    ctx.fillStyle = sc; ctx.globalAlpha = .25; ctx.fillRect(sx-7, sy-5, 14, 10); ctx.fillRect(sx-5, sy-7, 10, 14); ctx.globalAlpha = 1;
    ctx.fillRect(sx-4, sy-3, 8, 6); ctx.fillRect(sx-3, sy-4, 6, 8);
  }
  if (T.moon > .05){
    const nt = ((h + 24 - 19) % 24) / 11;    // 19:00 -> 06:00
    const mx = Math.round(lerp(130, 40, clamp(nt,0,1))), my = Math.round(60 - Math.sin(clamp(nt,0,1)*Math.PI)*42);
    ctx.globalAlpha = T.moon;
    ctx.fillStyle = 'rgba(200,210,255,.18)'; ctx.fillRect(mx-6,my-4,12,8); ctx.fillRect(mx-4,my-6,8,12);
    ctx.fillStyle = '#eef0ff'; ctx.fillRect(mx-3,my-2,6,4); ctx.fillRect(mx-2,my-3,4,6);
    ctx.fillStyle = T.top; ctx.fillRect(mx,my-3,3,2); ctx.fillRect(mx+1,my-1,2,2);
    ctx.globalAlpha = 1;
  }
  // clouds
  const cloudCol = mix(mix('#ffffff', T.hor, .35), T.top, T.stars*.6);
  for (const c of CLOUDS){
    const x = Math.round(((c.x + t*c.s*1.2) % 200) - 20);
    ctx.fillStyle = shade(cloudCol, .82); ctx.fillRect(x+2, c.y+2, c.w, 3);
    ctx.fillStyle = cloudCol; ctx.fillRect(x, c.y, c.w, 3); ctx.fillRect(x+3, c.y-2, Math.floor(c.w*.5), 2); ctx.fillRect(x+Math.floor(c.w*.45), c.y-3, Math.floor(c.w*.3), 3);
  }
  skyTex.needsUpdate = true;
}

const MAG = { w:.21*SM, h:.28*SM, leaves:[], spread:0, N:8, block:.0045, eps:.00045 };

function leafGeometry(w, h, seg){
  const n = seg+1, pos = new Float32Array(n*2*2*3), uv = new Float32Array(n*2*2*2), idx = [];
  for (let half=0; half<2; half++) for (let i=0;i<n;i++) for (let j=0;j<2;j++){
    const k = half*n*2 + i*2 + j, x = i/seg*w, z = j ? h/2 : -h/2;
    pos[k*3] = x; pos[k*3+1] = 0; pos[k*3+2] = z;
    uv[k*2] = half ? 1 - i/seg : i/seg; uv[k*2+1] = j ? 0 : 1;
  }
  const g = new THREE.BufferGeometry();
  for (let half=0; half<2; half++){
    for (let i=0;i<seg;i++){
      const o = half*n*2, a = o+i*2, b = o+i*2+1, c = o+(i+1)*2, d = o+(i+1)*2+1;
      if (!half) idx.push(a,b,c, c,b,d); else idx.push(a,c,b, c,d,b);
    }
  }
  g.setIndex(idx);
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.addGroup(0, seg*6, 0); g.addGroup(seg*6, seg*6, 1);
  g.computeVertexNormals();
  g.userData = { seg, w, n };
  return g;
}
function bendLeaf(L, p, dir){
  const g = L.geo, pos = g.attributes.position, { seg, w, n } = g.userData;
  const lift = Math.sin(p*Math.PI);
  for (let half=0; half<2; half++) for (let i=0;i<n;i++){
    const f = i/seg, y = -dir * lift * .22 * w * f*f;
    for (let j=0;j<2;j++){ const k = half*n*2 + i*2 + j; pos.setY(k, y + (half ? -.00005 : 0)); pos.setX(k, f*w*(1 - lift*.06*f)); }
  }
  pos.needsUpdate = true; g.computeVertexNormals(); g.computeBoundingSphere();
}

function magSetSpread(s, stagger=.12){
  s = clamp(s, 0, MAG.N);
  const prev = MAG.spread; MAG.spread = s;
  let n = 0;
  const order = s > prev ? MAG.leaves : [...MAG.leaves].reverse();
  order.forEach(L=>{
    const to = L.k < s ? Math.PI : 0;
    if (to !== L.to){ L.from = L.angle; L.to = to; L.t = 0; L.dir = to > L.from ? 1 : -1; L.delay = n++ * stagger; }
  });
}
function magUpdate(dt){
  for (const L of MAG.leaves){
    if (L.t >= 1 && L.angle === L.to) continue;
    if (L.delay > 0){ L.delay -= dt; continue; }
    L.t = Math.min(1, L.t + dt / (reduceMotion ? .01 : .55));
    const e = ease(L.t);
    L.angle = lerp(L.from, L.to, e);
    const p = L.angle / Math.PI;
    L.pivot.rotation.z = L.angle;
    L.pivot.position.y = lerp(L.y0, L.y1, p) + Math.sin(p*Math.PI)*.002;
    bendLeaf(L, L.t < 1 ? Math.sin(e*Math.PI)*.5+.0 : 0, L.dir);
    if (L.t >= 1) L.angle = L.to;
  }
}

function makePoints(n, color, size){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(n*3), 3));
  g.setAttribute('alpha', new THREE.Float32BufferAttribute(new Float32Array(n), 1));
  const m = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false,
    uniforms:{ color:{ value:new THREE.Color(color) }, size:{ value:size }, scale:{ value:300 } },
    vertexShader:`attribute float alpha; varying float vA; uniform float size; uniform float scale;
      void main(){ vA = alpha; vec4 mv = modelViewMatrix*vec4(position,1.0); gl_Position = projectionMatrix*mv; gl_PointSize = max(1.0, floor(size*scale/-mv.z + .5)); }`,
    fragmentShader:`uniform vec3 color; varying float vA; void main(){ if (vA < .01) discard; gl_FragColor = vec4(color, vA); }`,
  });
  const p = new THREE.Points(g, m); p.frustumCulled = false; fx_(p); scene.add(p);
  return p;
}
const steamMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false,
  uniforms:{ time:{ value:0 }, hot:{ value:1 }, color:{ value:new THREE.Color('#d9d3c9') } },
  vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`uniform float time, hot; uniform vec3 color; varying vec2 vUv;
    void main(){
      vec2 uv = vUv; float y = uv.y; float a = 0.0;
      for (int i=0;i<3;i++){
        float fi = float(i), ph = fi*2.1;
        float cx = .5 + (fi-1.0)*.13 + sin(y*7.0 - time*1.8 + ph)*.16*y + sin(y*15.0 - time*2.6 + ph*1.7)*.04*y;
        float w = mix(.075, .045, y);
        float line = smoothstep(w, w*.35, abs(uv.x - cx));
        float puff = smoothstep(.15, .45, fract(y*1.7 - time*.45 + fi*.37));
        a = max(a, line * puff * (1.0 - fi*.15));
      }
      a *= smoothstep(0.0, .1, y) * smoothstep(1.0, .55, y) * hot;
      a = a > .5 ? .3 : (a > .22 ? .13 : 0.0);
      if (a <= 0.0) discard;
      gl_FragColor = vec4(color, a);
    }`,
});

function gbInput(k){

function render(){

  renderer.setRenderTarget(rtNormal); renderer.setClearColor('#8080ff', 1); renderer.clear();
  const sm = renderer.shadowMap.autoUpdate; renderer.shadowMap.autoUpdate = false;

/* =====================================================================
   HOLDING THINGS
   An object is lifted off its spot into a pivot that flies to the centre

   and a second click uses it. Clicking anywhere else puts it back exactly
   where it was.
   ===================================================================== */
const HOLD_D = .62;                                  // metres in front of the camera
const qE = (x,y,z)=>new THREE.Quaternion().setFromEuler(new THREE.Euler(x,y,z,'YXZ'));
const Q_FLAT = qE(Math.PI/2, 0, 0);                  // lying face-up -> facing the camera
const HOLD = { id:null, busy:false, dim:0, phase:null, t:0, drag:null, dragged:false };
const SPEC = {
  magazine: { q:Q_FLAT, frac:.8, spring:true },
  phone:    { q:Q_FLAT, frac:.8, spring:true },
  gameboy:  { q:Q_FLAT, frac:.8 },
  'cart-exp':{ q:qE(Math.PI/2-.25, .35, 0), frac:.5 }, 'cart-skl':{ q:qE(Math.PI/2-.25, .35, 0), frac:.5 }, 'cart-time':{ q:qE(Math.PI/2-.25, .35, 0), frac:.5 },
  coffee:   { q:qE(.38, -.55, 0), frac:.6, d:.85 },
  succulent:{ q:qE(.55, 0, 0), frac:.6, d:.85 },
  kp17:     { q:qE(.12, -.5, 0), frac:.56, d:1.25 },
  album:    { q:qE(0, .22, 0), frac:.64 },

function specFor(id){ return SPEC[id] || (id.startsWith('album-') ? SPEC.album : SPEC.coffee); }

const _m4 = new THREE.Matrix4(), _b = new THREE.Box3();
function localBox(obj, filter){
  obj.updateWorldMatrix(true, true);
  const inv = new THREE.Matrix4().copy(obj.matrixWorld).invert(), box = new THREE.Box3();
  obj.traverse(c=>{
    if (!c.isMesh || !c.visible || !c.layers.isEnabled(0) || (filter && !filter(c))) return;
    if (!c.geometry.boundingBox) c.geometry.computeBoundingBox();
    _b.copy(c.geometry.boundingBox).applyMatrix4(_m4.multiplyMatrices(inv, c.matrixWorld)); box.union(_b);
  });
  return box;
}
function fitScale(box, q, frac){
  const pts = [];
  for (let i=0;i<8;i++) pts.push(V3(i&1?box.max.x:box.min.x, i&2?box.max.y:box.min.y, i&4?box.max.z:box.min.z).applyQuaternion(q));
  const ex = Math.max(...pts.map(p=>p.x)) - Math.min(...pts.map(p=>p.x));
  const ey = Math.max(...pts.map(p=>p.y)) - Math.min(...pts.map(p=>p.y));
  const vh = viewH(holdDist()), vw = vh * camera.aspect;
  return Math.min(frac*vh/ey, Math.min(.94, frac*1.25)*vw/ex);
}
/* texels the given local length occupies on screen once held at scale s */
const pxFor = (len, s)=>Math.round(len * s / viewH(holdDist()) * RH * .86);
function holdDist(){ return (HOLD.spec && HOLD.spec.d) || HOLD_D; }   // a little under 1:1 so pixels only ever double, never drop

function pickUp(id, opts={}){
  if (HOLD.id || HOLD.busy) return;
  const it = INTERACT[id]; if (!it || it.kind !== 'hold') return;
  const obj = it.obj, spec = specFor(id);
  HOLD.spec = spec;
  if (STATE.hovered){ setMask(INTERACT[STATE.hovered].obj, false); STATE.hovered = null; }
  const box = localBox(obj);
  const center = box.getCenter(V3());
  const worldCenter = obj.localToWorld(center.clone());
  const q0 = obj.getWorldQuaternion(new THREE.Quaternion());
  const pivot = new THREE.Object3D(); pivot.position.copy(worldCenter); scene.add(pivot); pivot.updateMatrixWorld();
  const saved = { parent:obj.parent, pos:obj.position.clone(), quat:obj.quaternion.clone(), scale:obj.scale.clone() };
  pivot.attach(obj);
  const shadows = []; obj.traverse(c=>{ if (c.isMesh){ shadows.push([c, c.castShadow]); c.castShadow = false; } });
  setMask(obj, true);
  Object.assign(HOLD, {
    id, it, obj, spec, pivot, saved, shadows, q0inv:q0.clone().invert(), start:worldCenter.clone(),
    box, fitBox:box.clone(), frac:spec.frac, focus:center.clone(), focusT:center.clone(),
    s:1, sT:fitScale(box, spec.q, spec.frac), t:0, phase:'up', busy:true,
    viaKey:false, userQ:new THREE.Quaternion(), tilt:{ x:0, y:0 }, vel:{ x:0, y:0 }, useQ:new THREE.Quaternion(), useP:V3(), anim:null, mode:'closed',
  });

  const onPick = ON_PICK[id] || (id.startsWith('album-') ? ON_PICK.album : null);

}
function putDown(){
  if (!HOLD.id || HOLD.phase === 'down') return;
  const id = HOLD.id;
  const onPut = ON_PUT[id] || (id.startsWith('album-') ? ON_PUT.album : null);
  if (onPut) onPut();
  HOLD.phase = 'down'; HOLD.busy = true;
  sfx.put();
  hotHide();
  announce('Put it back.');
}
function finishPutDown(){
  const { obj, saved, pivot, shadows, id } = HOLD;
  saved.parent.attach(obj);
  obj.position.copy(saved.pos); obj.quaternion.copy(saved.quat); obj.scale.copy(saved.scale);
  scene.remove(pivot);
  shadows.forEach(([c,v])=>c.castShadow = v);
  setMask(obj, false);
  if (BLOBS[id]) BLOBS[id].userData.fade = false;
  const after = HOLD.after; HOLD.after = null;
  HOLD.id = null; HOLD.busy = false; HOLD.phase = null; HOLD.obj = null;
  if (ON_DONE[id]) ON_DONE[id]();

/* change what part of the object is framed, and how big */
function reframe(localBox_, frac, focusLocal){
  HOLD.fitBox = localBox_; HOLD.frac = frac;
  HOLD.sT = fitScale(localBox_, HOLD.spec.q, frac);
  HOLD.focusT = focusLocal || localBox_.getCenter(V3());
}

const _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _v = V3(), _v2 = V3();
function holdUpdate(dt){
  HOLD.dim = damp(HOLD.dim, HOLD.id && HOLD.phase !== 'down' ? 1 : 0, 7, dt);
  holdLightsUpdate(dt);
  albumTick(dt);
  for (const k in BLOBS){ const b = BLOBS[k]; b.material.opacity = damp(b.material.opacity, b.userData.fade ? 0 : b.userData.op, 9, dt); }
  if (ROOM.drop){ const d = ROOM.drop; d.t = Math.min(1, d.t + dt/.45); d.obj.position.y = d.y + (1 - easeOut(d.t))*.16 + Math.sin(d.t*Math.PI)*.0; if (d.t >= 1){ d.obj.position.y = d.y; ROOM.drop = null; } }
  if (!HOLD.id) return;
  if (HOLD.refit){ HOLD.refit = false; HOLD.sT = fitScale(HOLD.fitBox, HOLD.spec.q, HOLD.frac); }
  const dur = reduceMotion ? .01 : (HOLD.phase === 'up' ? .55 : .48);
  if (HOLD.phase === 'up'){ HOLD.t = Math.min(1, HOLD.t + dt/dur); if (HOLD.t >= 1){ HOLD.phase = 'held'; HOLD.busy = false; if (HOLD.onHeld){ const f = HOLD.onHeld; HOLD.onHeld = null; f(); } } }
  if (HOLD.phase === 'down'){ HOLD.t = Math.max(0, HOLD.t - dt/dur); if (HOLD.t <= 0){ finishPutDown(); return; } }
  const e = ease(HOLD.t);
  HOLD.s = damp(HOLD.s, HOLD.sT, 7, dt);
  HOLD.focus.lerp(HOLD.focusT, 1 - Math.exp(-7*dt));

  // turning: drag inertia, springs back for things meant to be read
  if (!HOLD.drag){
    if (Math.abs(HOLD.vel.x) + Math.abs(HOLD.vel.y) > .0001){
      _q.setFromAxisAngle(V3(0,1,0), HOLD.vel.x); _q2.setFromAxisAngle(V3(1,0,0), HOLD.vel.y);
      HOLD.userQ.premultiply(_q).premultiply(_q2);

    }

  }
  // the held thing leans toward the cursor
  const tx = STATE.pointerIn && !HOLD.drag && !reduceMotion ? STATE.pointer.y * -.2 : 0;
  const ty = STATE.pointerIn && !HOLD.drag && !reduceMotion ? STATE.pointer.x * .3 : 0;
  const k = HOLD.mode === 'closed' ? 1 : .35;
  HOLD.tilt.x = damp(HOLD.tilt.x, tx*k, 5, dt); HOLD.tilt.y = damp(HOLD.tilt.y, ty*k, 5, dt);
  if (HOLD.anim){ HOLD.anim.t += dt; if (!HOLD.anim.step(HOLD.anim.t)) { HOLD.anim = null; HOLD.useQ.identity(); HOLD.useP.set(0,0,0); } }

  const camQ = camera.getWorldQuaternion(new THREE.Quaternion());
  const bob = reduceMotion ? 0 : Math.sin(STATE.t*1.6)*.004;
  const qHeld = camQ.clone()
    .multiply(qE(HOLD.tilt.x, HOLD.tilt.y, 0))
    .multiply(HOLD.useQ).multiply(HOLD.userQ).multiply(HOLD.spec.q).multiply(HOLD.q0inv);

function holdLightsUpdate(dt){

/* rotate with a drag */
function holdDrag(dx, dy){
  const a = dx * .011, b = dy * .011;
  _q.setFromAxisAngle(V3(0,1,0), a); _q2.setFromAxisAngle(V3(1,0,0), b);

  if (!HOLD.obj) return null;

/* ---- magazine ---- */
function magPortrait(){ return camera.aspect < .9; }
function magFrame(){

  if (HOLD.mode === 'closed'){ reframe(new THREE.Box3(V3(-w/2, 0, -h/2), V3(w/2, top, h/2)), .8); return; }
  if (!magPortrait()){ reframe(new THREE.Box3(V3(-3*w/2, 0, -h/2), V3(w/2, top, h/2)), .86, V3(-w/2, top, 0)); return; }

}
function magPaintPages(){
  const sOpen = magPortrait() ? fitScale(new THREE.Box3(V3(-MAG.w/2,0,-MAG.h/2), V3(MAG.w/2,.01,MAG.h/2)), Q_FLAT, .9)
                              : fitScale(new THREE.Box3(V3(-3*MAG.w/2,0,-MAG.h/2), V3(MAG.w/2,.01,MAG.h/2)), Q_FLAT, .86);
  const ph = clamp(pxFor(MAG.h, sOpen), 120, 420), pw = Math.round(ph * MAG.w / MAG.h);
  MAG.leaves.forEach(L=>{ repaint(L.recto, pw, ph, magPainter(L.k, 'r')); repaint(L.verso, pw, ph, magPainter(L.k, 'v')); });
  repaint(MAG.insideBack, pw, ph, PAGE.colophon);
  MAG.painted = [pw, ph];
}
ON_PICK.magazine = ()=>{
  HOLD.mode = 'closed'; MAG.focusSide = 'L';
  const sC = fitScale(new THREE.Box3(V3(-MAG.w/2,0,-MAG.h/2), V3(MAG.w/2,.01,MAG.h/2)), Q_FLAT, .8);
  const ph = clamp(pxFor(MAG.h, sC), 96, 420);
  repaint(MAG.leaves[0].recto, Math.round(ph*MAG.w/MAG.h), ph, PAGE.cover);
  MAG.leaves[0].recto.emissiveIntensity = .3;

};
ON_PUT.magazine = ()=>{ if (MAG.spread) magSetSpread(0, .05); };
ON_DONE.magazine = ()=>{ const r = MAG.leaves[0].recto; r.map = texMagCover; r.emissiveMap = texMagCover; r.emissiveIntensity = .2; r.needsUpdate = true; };
ON_USE.magazine = (hit, key)=>{
  if (HOLD.mode === 'closed'){

  }
  let side = key || 'R';
  const portrait = magPortrait();
  if (hit && !key){ if (portrait) side = STATE.pointer.x < -.2 ? 'L' : 'R'; else { const lp = MAG_LOCAL(hit.point); side = lp.x < -MAG.w/2 ? 'L' : 'R'; } }

    if (portrait && MAG.focusSide === 'L'){ MAG.focusSide = 'R'; magFrame(); sfx.tick(true); return; }
    if (MAG.spread >= MAG.N){ magSetSpread(0, .06); HOLD.mode = 'closed'; magFrame(); sfx.page(); announce('Closed the magazine.'); return; }

      if (!expanded){
        const w = Math.max(widthP(a, 1), widthP(b)) + 12, h = 24, x = Math.round(RW/2 - w/2), y = RH - h - 8;
        pxPlate(x, y, w, h); drawPC(mctx, a, RW/2, y+3, '#e9b04b'); drawPC(mctx, b, RW/2, y+13, '#f4e9cf');
      }
      if (showHint){
        const f = hintAge > 4.4 ? (5 - hintAge)/.6 : 1;
        mctx.globalAlpha *= f > .66 ? 1 : f > .33 ? .66 : .33;
        const y = expanded ? 6 : RH - 24 - 8 - 13;
        shadowP(hintText, Math.round(RW/2 - widthP(hintText)/2), y, '#a197b3');
      }
      mctx.globalAlpha = 1; drew = true;
    }
  } else PLATE.id = null;
  return drew;
}
function drawMarks(t){
  mctx.clearRect(0,0,marks.width,marks.height);
  const words = drawWords(t);
  if (!INFO.on) return words;
  const groups = infoGroups(); let gi = 0; const labels = [];
  const box = new THREE.Box3();
  for (const label in groups){
    box.makeEmpty(); groups[label].forEach(o=>box.expandByObject(o));
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, behind = false;
    for (let i=0;i<8;i++){
      const p = V3(i&1?box.max.x:box.min.x, i&2?box.max.y:box.min.y, i&4?box.max.z:box.min.z).project(camera);
      if (p.z > 1) behind = true;
      const x = (p.x*.5+.5)*RW, y = (-p.y*.5+.5)*RH; x0 = Math.min(x0,x); y0 = Math.min(y0,y); x1 = Math.max(x1,x); y1 = Math.max(y1,y);
    }
    if (behind || x1 < 0 || y1 < 0 || x0 > RW || y0 > RH) { gi++; continue; }
    const cx = (x0+x1)/2, cy = (y0+y1)/2, rx = Math.max(7, (x1-x0)/2 + 4), ry = Math.max(6, (y1-y0)/2 + 3);
    const prog = clamp((t - INFO.t0)*2.2 - gi*.07, 0, 1); gi++;
    if (prog <= 0) continue;
    const seed = label.length*1.7 + label.charCodeAt(0)*.13, a0 = -2.2 + seed%1;
    const steps = Math.ceil(Math.PI*2*Math.max(rx,ry)*1.6 * 1.08);
    const n = Math.floor(steps * easeOut(prog));
    const pts = [];
    for (let i=0;i<=n;i++){
      const a = a0 + i/steps * Math.PI*2*1.08;
      const j = 1 + .05*Math.sin(a*3 + seed) + .025*Math.sin(a*7 + seed*2) + (i/steps)*.06;
      pts.push([Math.round(cx + Math.cos(a)*rx*j), Math.round(cy + Math.sin(a)*ry*j)]);
    }
    mctx.fillStyle = 'rgba(14,12,19,.85)'; pts.forEach(([x,y])=>mctx.fillRect(x+1, y+1, 1, 1));
    mctx.fillStyle = '#f4e9cf'; pts.forEach(([x,y])=>mctx.fillRect(x, y, 1, 1));
    if (prog > .85) labels.push({ label, cx, cy, rx, ry });
  }
  // place labels where they don't collide, with a leader line back to the circle (like the sketch)
  const placed = [];
  const hits = (r)=>placed.some(p=>r.x < p.x+p.w+3 && r.x+r.w+3 > p.x && r.y < p.y+p.h+2 && r.y+r.h+2 > p.y);
  for (const L of labels){
    const tw = widthP(L.label) + 4, th = 11;
    const cands = [
      [L.cx + L.rx*.6, L.cy + L.ry*.8], [L.cx - L.rx*.6 - tw, L.cy + L.ry*.8], [L.cx - tw/2, L.cy + L.ry + 6],
      [L.cx - tw/2, L.cy - L.ry - th - 6], [L.cx + L.rx + 6, L.cy - th/2], [L.cx - L.rx - tw - 6, L.cy - th/2],
      [L.cx + L.rx*.6, L.cy + L.ry + 16], [L.cx - L.rx*.6 - tw, L.cy + L.ry + 16], [L.cx - tw/2, L.cy + L.ry + 28], [L.cx - tw/2, L.cy - L.ry - th - 20],
    ];
    let r = null;
    for (const [x,y] of cands){ const c = { x:Math.round(clamp(x, 2, RW - tw - 2)), y:Math.round(clamp(y, 2, RH - th - 2)), w:tw, h:th }; if (!hits(c)){ r = c; break; } }
    if (!r) continue;
    placed.push(r);
    const lx = clamp(L.cx, r.x, r.x + r.w), ly = clamp(L.cy, r.y, r.y + r.h);
    const ang = Math.atan2((ly - L.cy)/L.ry, (lx - L.cx)/L.rx);
    const ex = L.cx + Math.cos(ang)*L.rx, ey = L.cy + Math.sin(ang)*L.ry;
    if (Math.hypot(lx - ex, ly - ey) > 4 && Math.hypot(lx - L.cx, ly - L.cy) > Math.hypot(ex - L.cx, ey - L.cy)){
      const n = Math.ceil(Math.hypot(lx - ex, ly - ey));
      for (let i=0;i<=n;i++){ const x = Math.round(lerp(ex, lx, i/n)), y = Math.round(lerp(ey, ly, i/n)); mctx.fillStyle = 'rgba(14,12,19,.85)'; mctx.fillRect(x+1, y+1, 1, 1); mctx.fillStyle = '#f4e9cf'; mctx.fillRect(x, y, 1, 1); }
    }
    mctx.fillStyle = 'rgba(14,12,19,.85)'; mctx.fillRect(r.x, r.y, r.w, r.h);
    drawP(mctx, L.label, r.x + 2, r.y + 1, '#f4e9cf');
  }
  return true;
}
function infoOn(){ INFO.on = true; INFO.t0 = STATE.t; $('#info').setAttribute('aria-pressed', 'true'); sfx.tick(true);
  announce('You can pick up: the magazine, the phone, the Game Boy and its three cartridges, the coffee, the succulent, KP17 on the console, and the records on the right wall. The TV, lamp and roomba react to a click.'); }
function infoOff(){ INFO.on = false; $('#info').setAttribute('aria-pressed', 'false'); }

/* =====================================================================
   ACTIONS + INPUT
   ===================================================================== */
const ROOMBA_LINES = ['beep boop', 'mapping the room. again.', 'excuse me', '412 laps and counting'];
function activate(id){
  const it = INTERACT[id]; if (!it) return;
  if (it.kind === 'hold'){ pickUp(id); return; }
  if (id === 'tv'){ STATE.channel = (STATE.channel + 1) % CHANNELS.length; STATE.channelFlash = 1; sfx.channel(); say('tv', `ch 0${STATE.channel+1} \u00b7 ${CHANNELS[STATE.channel].toLowerCase()}`); announce('TV, channel ' + (STATE.channel+1) + ': ' + CHANNELS[STATE.channel].toLowerCase()); }
  if (id === 'lamp'){ STATE.lampOverride = !STATE.lampOn; TIME.dirty = true; sfx.lamp(); }
  if (id === 'roomba'){ roombaAI.spin = .9; sfx.roomba(); say('roomba', ROOMBA_LINES[(ROOM.beeps = (ROOM.beeps||0) + 1) % ROOMBA_LINES.length]); }
  if (id === 'window'){
    STATE.curtainsShut = !STATE.curtainsShut; sfx.curtain();
    const h = currentHour();
    say('window', STATE.curtainsShut ? 'curtains drawn' : `${hourLabel(h)} \u00b7 ${periodName(h).toLowerCase()}${TIME.warp !== null ? ', warped' : ' where you are'}`);
    announce(STATE.curtainsShut ? 'Curtains drawn.' : 'Curtains open. The sky outside follows your clock.');
  }
}
function setPointer(e){
  const r = canvas.getBoundingClientRect();
  STATE.pointer.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1);
  STATE.pointerIn = true;
  if (e.pointerType) STATE.pointerType = e.pointerType;
}
let down = null;
function onWorld(e){ return e.target === canvas || !!(e.target.closest && e.target.closest('a.hot')); }
addEventListener('pointerdown', e=>{
  sfx.unlock();
  if (INFO.on && !(e.target.closest && e.target.closest('#info'))){ infoOff(); down = { consumed:true }; return; }
  if (!onWorld(e)){ down = null; return; }
  setPointer(e);
  down = { x:e.clientX, y:e.clientY, lx:e.clientX, ly:e.clientY, moved:0, hot:!!e.target.closest('a.hot') };
  HOLD.dragged = false;
  if (HOLD.id && HOLD.phase === 'held'){
    const hit = HOLD.id === 'gameboy' && GBOS.power ? holdHit() : null;
    if (hit && hit.object.name === 'gbLCD') down.lcd = true; else HOLD.drag = true;
  }
});
addEventListener('pointermove', e=>{
  if (e.target === canvas || onWorld(e)) setPointer(e);
  if (!down || down.consumed) return;
  const dx = e.clientX - down.lx, dy = e.clientY - down.ly;
  down.lx = e.clientX; down.ly = e.clientY; down.moved += Math.abs(dx) + Math.abs(dy);
  if (down.moved <= 6) return;
  HOLD.dragged = true;
  if (down.lcd){
    if (GBOS.state === 'time'){ const hit = holdHit(); if (hit && hit.object.name === 'gbLCD') gbTap(hit.uv.x*160, 82); }
    else GBOS.scroll = clamp(GBOS.scroll - dy*.6, 0, GBOS.maxScroll);
    return;
  }
  if (HOLD.drag) holdDrag(dx, dy);
});
addEventListener('pointerup', e=>{
  const d = down; down = null; HOLD.drag = false;
  if (!d || d.consumed || d.moved > 6 || d.hot) return;
  if (HOLD.busy) return;
  if (HOLD.id){ const hit = holdHit(); if (hit) useHeld(hit); else putDown(); return; }
  const id = pick(); if (id) activate(id);
});
addEventListener('pointercancel', ()=>{ down = null; HOLD.drag = false; });
canvas.addEventListener('pointerleave', e=>{ if (e.pointerType === 'mouse' && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('a.hot'))) STATE.pointerIn = false; });
addEventListener('wheel', e=>{
  if (HOLD.id === 'gameboy' && GBOS.power && (GBOS.state === 'exp' || GBOS.state === 'skl')){ GBOS.scroll = clamp(GBOS.scroll + e.deltaY*.25, 0, GBOS.maxScroll); }
}, { passive:true });
function updateCursor(){
  let c = 'default';
  if (down && HOLD.dragged && HOLD.drag) c = 'grabbing';
  else if (HOLD.id && HOLD.phase === 'held') c = STATE.pointerIn && holdHit() ? 'pointer' : 'default';
  else if (STATE.hovered) c = 'pointer';
  if (canvas.style.cursor !== c) canvas.style.cursor = c;
}

/* keyboard: a list of the room's objects, visible only while it has focus */
const keyNav = $('#keynav');
const KEY_ITEMS = [['magazine','Magazine: projects'],['phone','Phone: socials'],['gameboy','Game Boy'],['cart-exp','Red cartridge'],['cart-skl','Blue cartridge'],['cart-time','Yellow cartridge'],['coffee','Coffee'],['succulent','Succulent'],['kp17','KP17 robot']]
  .concat(ALBUMS.map((a,i)=>['album-'+i, `${a.title}, ${a.artist}`])).concat([['tv','TV'],['lamp','Lamp'],['roomba','Roomba'],['window','Window curtains']]);
KEY_ITEMS.forEach(([id,label])=>{
  const b = document.createElement('button'); b.textContent = label; b.dataset.id = id;
  b.addEventListener('focus', ()=>{ if (!HOLD.id) STATE.keyHover = id; });
  b.addEventListener('blur', ()=>{ STATE.keyHover = null; });
  b.addEventListener('click', ()=>{ sfx.unlock(); STATE.keyHover = null; activate(id); if (HOLD.id === id) HOLD.viaKey = true; if (INTERACT[id].kind === 'hold') setTimeout(()=>{ if (HOLD.id && HOLD.id.startsWith('album-')) hots[0].focus({ preventScroll:true }); else if (HOLD.id === 'phone') hots[0].focus({ preventScroll:true }); }, 650); });
  keyNav.append(b);
});

const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let kIdx = 0;
addEventListener('keydown', e=>{
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  kIdx = key === KONAMI[kIdx] ? kIdx + 1 : (key === KONAMI[0] ? 1 : 0);
  if (kIdx === KONAMI.length){ kIdx = 0; STATE.party = !STATE.party; sfx.unlock(); sfx.cheat(); sayScreen(STATE.party ? 'party mode' : 'party over'); announce(STATE.party ? 'Party mode.' : 'Party over.'); return; }
  if (INFO.on && key !== 'Tab'){ infoOff(); if (key === 'Escape') return; }
  if (key === 'Escape'){ if (HOLD.id){ const back = HOLD.viaKey && keyNav.querySelector(`[data-id="${HOLD.id}"]`); putDown(); if (back) back.focus({ preventScroll:true }); else if (document.activeElement && document.activeElement.closest && document.activeElement.closest('a.hot')) document.activeElement.blur(); } return; }
  if (!HOLD.id){ if ((key === 'i' || key === '?') && !(e.target.closest && e.target.closest('button,a'))) infoOn(); return; }
  if (HOLD.busy) return;
  const onLink = e.target.closest && e.target.closest('a.hot');
  if (HOLD.id === 'magazine' && HOLD.mode !== 'closed' && (key === 'ArrowRight' || key === 'ArrowLeft')){ e.preventDefault(); useHeld(null, key === 'ArrowRight' ? 'R' : 'L'); return; }
  if (HOLD.id === 'gameboy' && GBOS.power){
    const m = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', z:'a', x:'b' };
    if (m[key]){ e.preventDefault(); gbInput(m[key]); return; }
  }
  if ((key === 'Enter' || key === ' ') && !onLink && !(e.target.closest && e.target.closest('#keynav,#corner'))){ e.preventDefault(); useHeld(null, HOLD.id === 'magazine' ? 'R' : (HOLD.id === 'gameboy' && GBOS.power ? 'a' : null)); return; }
  const rot = { ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1] }[key];
  if (rot){ e.preventDefault(); holdRotateKey(rot[0], rot[1]); }
});

$('#info').addEventListener('click', ()=>{ INFO.on ? infoOff() : infoOn(); });
const soundBtn = $('#sound');
function syncSound(){ soundBtn.setAttribute('aria-pressed', String(sfx.on)); soundBtn.setAttribute('aria-label', sfx.on ? 'Sound on' : 'Sound off'); soundBtn.classList.toggle('off', !sfx.on); }
soundBtn.addEventListener('click', ()=>{ sfx.set(!sfx.on); syncSound(); sfx.unlock(); sfx.click(); });
syncSound();

/* =====================================================================
   BOOT
   ===================================================================== */
function boot(){
  const bar = $('#load-bar');
  if (!renderer || !renderer.capabilities.isWebGL2){
    $('#loader').classList.add('done');
    const f = document.createElement('div'); f.id = 'fallback';
    f.innerHTML = `<div class="box"><h2>This room needs WebGL 2</h2><p><a href="${LINKS.github}" target="_blank" rel="noopener">GitHub</a> · <a href="${LINKS.linkedin}" target="_blank" rel="noopener">LinkedIn</a> · <a href="${LINKS.v1}" target="_blank" rel="noopener">Pocket Dev</a></p></div>`;
    document.body.append(f); return;
  }
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.BasicShadowMap;
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  bar.style.width = '40%';
  resize();
  addEventListener('resize', ()=>{ resize(); MAG.painted = null; if (HOLD.id === 'magazine' && HOLD.mode !== 'closed'){ magPaintPages(); magFrame(); } if (HOLD.id === 'phone') PH.dirty = true; });
  applyTime(currentHour()); TIME.last = currentHour();
  drawSky(TIME.T, TIME.h, 0); drawTV(0); gbPaint(0); phoneTick(0);
  pickRoombaTarget();
  bar.style.width = '75%';
  renderer.compile(scene, camera);
  requestAnimationFrame(t=>{ lastT = t; frame(t); setTimeout(()=>{ bar.style.width = '100%'; setTimeout(()=>$('#loader').classList.add('done'), 200); }, 220); });
}
boot();
